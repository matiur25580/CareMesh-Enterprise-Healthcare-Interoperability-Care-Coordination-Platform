name: Dependency security audit

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate temporary workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install from generated lockfile
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Preserve generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caremesh-generated-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
